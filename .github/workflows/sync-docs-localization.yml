name: Sync Docs Localization

on:
  push:
    paths:
      - 'NeeView/Languages/ru.restext'
      - 'NeeView/Languages/en.restext'
    branches:
      - master

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run synchronization script
        run: python docs/scripts/sync_ru_docs.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n "$(git status --porcelain docs/ru-ru/)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ru-ru/
          git commit -m "docs: Auto-sync Russian documentation with ru.restext"
          git push
