<div id="culture_home"></div>
<div id="culture_switch"></div>

<script>
    function getCurrentCulture() {
        const path = location.pathname.split('/');
        if (path.includes("ja-jp")) {
            return "ja-jp";
        }
        else if (path.includes("en-us")) {
            return "en-us";
        }
        else if (path.includes("ru-ru")) {
            return "ru-ru";
        }
        else {
            return null;
        }
    }

    function setCultureSwitch(culture) {
        const cultures = [
            { code: "ja-jp", label: "日本語" },
            { code: "en-us", label: "ENGLISH" },
            { code: "ru-ru", label: "РУССКИЙ" }
        ];

        const path = location.pathname.split('/');
        const index = path.indexOf(culture);
        if (index < 0) return;

        const otherLinks = cultures
            .filter(c => c.code !== culture)
            .map(c => {
                const newPath = [...path];
                newPath[index] = c.code;
                return `<a href="${newPath.join('/')}">${c.label}</a>`;
            });

        const element = document.getElementById("culture_switch");
        if (element == null) return;
        element.innerHTML = otherLinks.join(' / ');
    }

    function setCultureHome(culture) {
        if (culture == null) return;
        const element = document.getElementById("culture_home");
        if (element == null) return;
        const homeLabel = culture === "ru-ru" ? "ГЛАВНАЯ" : culture === "ja-jp" ? "ホーム" : "HOME";
        element.innerHTML = `<a href="{{ site.baseurl }}/${culture}/">${homeLabel}</a>`;
    }

    function setCultureElement() {
        const culture = getCurrentCulture();
        if (culture == null) return;
        setCultureSwitch(culture);
        setCultureHome(culture);
    }

    setCultureElement();

</script>
